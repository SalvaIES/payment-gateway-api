<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagar con Stripe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        body {
            background: linear-gradient(135deg, #212529 0%, #495057 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .payment-card {
            background: white;
            border-radius: 1rem;
            padding: 2.5rem;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        #card-element {
            border: 1px solid #ced4da;
            border-radius: 0.375rem;
            padding: 0.75rem;
        }
        #card-errors { color: #dc3545; font-size: 0.875rem; margin-top: 0.5rem; }
    </style>
</head>
<body>
<div class="payment-card">
    <h4 class="mb-1"><i class="bi bi-credit-card"></i> Pagar con Stripe</h4>
    <p class="text-muted mb-4">Transacción #{{ transaction.id }} — {{ transaction.amount }} {{ transaction.currency }}</p>

    <div id="card-element" class="mb-3"></div>
    <div id="card-errors"></div>

    <button id="pay-btn" class="btn btn-primary w-100 mt-3">
        Pagar {{ transaction.amount }} {{ transaction.currency }}
    </button>

    <a href="/transactions/" class="btn btn-outline-secondary w-100 mt-2">Cancelar</a>
</div>

<script>
    const stripe = Stripe('{{ stripe_publishable_key }}');
    const elements = stripe.elements();
    const card = elements.create('card');
    card.mount('#card-element');

    document.getElementById('pay-btn').addEventListener('click', async () => {
        const btn = document.getElementById('pay-btn');
        btn.disabled = true;
        btn.textContent = 'Procesando...';

        const { error, paymentIntent } = await stripe.confirmCardPayment(
            '{{ client_secret }}',
            { payment_method: { card: card } }
        );

        if (error) {
            document.getElementById('card-errors').textContent = error.message;
            btn.disabled = false;
            btn.textContent = 'Pagar {{ transaction.amount }} {{ transaction.currency }}';
        } else if (paymentIntent.status === 'succeeded') {
            window.location.href = '/transactions/';
        }
    });
</script>
</body>
</html>
